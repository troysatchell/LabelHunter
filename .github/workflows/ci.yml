# CI — the merge gate for LabelHunter.
#
# Two jobs run on every pull request and every push to main:
#
# - `verify` — typecheck, lint, golden-set checks, build, migrate, unit tests,
#   and the eval-harness regression check.
# - `e2e` — the Playwright suite against a fake Anthropic server.
#
# Neither job needs an ANTHROPIC_API_KEY, and neither job spends real API money.
# Every model call is faked or read from a committed artifact. See each step's
# own comment for how.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # TRO-562: pinned by digest, not the mutable `16-alpine` tag. Dependabot
      # does not track digests inside a workflow's `services:` block (its
      # `github-actions` ecosystem below only follows `uses:` steps) — see
      # the dependabot.yml comment for the manual re-check this needs.
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: labelhunter
          POSTGRES_PASSWORD: labelhunter_ci_password
          POSTGRES_DB: labelhunter_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U labelhunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://labelhunter:labelhunter_ci_password@localhost:5432/labelhunter_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # `pnpm install` does not download Playwright's browser binaries — a
        # separate, explicit install step is required. Without it, every test
        # that launches a real Chromium (scripts/golden/build.test.ts,
        # scripts/golden/render.test.ts) fails on a fresh runner with
        # "browserType.launch: Executable doesn't exist". `--with-deps` also
        # installs the Linux system libraries headless Chromium needs.
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Golden set verify
        # LH-006 / TRO-499: manifest schema, image existence both directions,
        # rubric vector coverage. Fast, metadata-only — no browser, no
        # network, no image-generation API call (TH-R7's constrained-network
        # posture). A separate, clearly labeled step, so a golden-set
        # regression reads directly in the job log.
        run: pnpm golden:verify

      - name: Golden set render smoke
        # LH-006 / TRO-499, design doc §7: "render one label headlessly,
        # then run verify.ts." Confirms headless Chromium and the renderer's
        # embedded fonts actually work on THIS runner — no network call,
        # Chromium and every font are already local, committed dependencies
        # (see "Install Playwright browsers" above). Narrower and faster
        # than render.test.ts's full determinism/font suite, which still
        # runs as part of "Unit tests" below.
        run: pnpm golden:render-smoke

      - name: Build
        run: pnpm build

      - name: Migrate
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Eval harness not regressed
        # TRO-470 / LH-030: `pnpm eval:check` with no flags makes NO live
        # Anthropic API call — it reads the committed
        # scripts/eval/results/eval-report.json and scripts/eval/baseline.json
        # (checked out by this job like any other file) and compares them.
        # This job has no ANTHROPIC_API_KEY and must not need one: CI runs on
        # every push and every PR update, and a real per-case pipeline sweep
        # here would be real, unbounded, per-commit API spend. The real
        # sweep — the re-baseline protocol, `pnpm eval:variance -- --live
        # --full --repeats=3 --establish-baseline` (TRO-561; extends the
        # eval:variance sweep rather than a second cascade path) — is a
        # deliberate, human-invoked step that refreshes the committed
        # report/baseline band together; this job only checks that the last
        # committed refresh still holds. TRO-561 also made the baseline a
        # K-repeat BAND, not one run's point — the floor is the band's own
        # measured minimum, and a corpus edit alone (no code regression)
        # reports as its own "stale-baseline" problem class, a loud warning
        # in this cheap mode rather than a false-positive "regressed"
        # failure (see baseline-compare.ts's own module comment).
        run: pnpm eval:check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # TRO-522: pnpm test:e2e (the Playwright suite, TRO-479) as its own,
    # separately-named check — never folded into the unit-test step above.
    # This job reproduces the same worker + fake-Anthropic-server lifecycle
    # playwright.config.ts already manages locally (its own `webServer`
    # array starts the fake model server, the Next.js app, and the batch
    # worker; see that file for how each process finds the others).
    #
    # E2E_LIVE is never set here, on purpose. playwright.config.ts treats an
    # unset E2E_LIVE as "point every outbound Anthropic call at
    # scripts/e2e/fake-anthropic-server.ts" — this job spends no real API
    # money and needs no ANTHROPIC_API_KEY. E2E_LIVE=1 stays a deliberate,
    # human-invoked opt-in, run locally, never automatic here.
    services:
      # TRO-562: pinned by digest — see the "verify" job's postgres service
      # comment above for why Dependabot does not track this one.
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: labelhunter
          POSTGRES_PASSWORD: labelhunter_ci_password
          POSTGRES_DB: labelhunter_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U labelhunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://labelhunter:labelhunter_ci_password@localhost:5432/labelhunter_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # Same requirement as the "verify" job's own copy of this step
        # (see its comment): Chromium ships as a separate download `pnpm
        # install` never fetches, and `--with-deps` also installs the
        # Linux libraries headless Chromium needs on a fresh runner.
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate
        # The app and worker processes playwright.config.ts's webServer
        # starts below both need a migrated schema to serve real
        # requests — same command the "verify" job runs before its own
        # unit suite.
        run: pnpm db:migrate

      - name: E2E suite (fake Anthropic API — default, no live spend)
        # playwright.config.ts's own webServer entries do the rest: build
        # + start the Next.js app, start the batch worker, and (since
        # E2E_LIVE is unset above) start scripts/e2e/fake-anthropic-server.ts
        # and point every outbound Anthropic call at it. No fixed sleep —
        # each webServer entry waits on its own real, observable readiness
        # signal (a port, or the worker's own startup log line).
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            test-results/
          if-no-files-found: ignore
