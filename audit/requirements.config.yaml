# Requirements-audit config
# Updated 2026-08-10: repo scaffolded (TRO-456 merged), Wave 1 dispatching. Values below
# are measured facts, cross-checked against factory/config.yaml's gate-verified commands
# and a live Linear query (team Troysatchell spans PlugForge, FleetGraph, ShipShape Audit
# Remediation, and LabelHunter — project scope is load-bearing, not optional).

docs:
  - id: TH
    path: "/Users/troy/Documents/G.Assignments/Take-Home Project_ AI-Powered Alcohol Label Verification App.docx"
    sha256: "7f50443d68066298042d808ef08611b49393ed14ace13ee810c9807a9f59d2e4"
    note: "docx, not PDF — source cached to audit/requirements/source-TH.md via textutil; Source: fields cite cache line numbers, not pages. Hash re-verified 2026-08-10 — unchanged, inventory still current."

# Repo root, not just src/ — this brief grades process and deliverables (README, approach
# doc, CI config, golden-set assets, factory traceability) as much as application code.
code_roots:
  - "."
exclude:
  - node_modules
  - .next
  - dist
  - .git
  - .env.local
  - .env.local.example
  - audit/requirements   # this skill's own output only — never the whole audit/ tree

verify:
  typecheck: "pnpm typecheck"
  lint: "pnpm lint"
  build: "pnpm build"
  test: "pnpm test"
  e2e: "pnpm test:e2e"
  dbMigrate: "pnpm db:migrate"
verify_urls:
  # Updated 2026-08-13: TRO-481 (Render deploy) merged, and TRO-482 (key protection)
  # now gates every route except /api/health, /access-code and /api/access-code.
  # An unauthenticated GET / returns 307 -> /access-code; an unauthenticated
  # /api/* returns 401. Both are CORRECT responses from a live app, not outages.
  # A probe that needs past the gate must send the x-access-code header; the value
  # lives ONLY in Render's dashboard (render.yaml declares it sync: false), never
  # in this repo. Verified live 2026-08-13 in both directions.
  app: "https://labelhunter-web.onrender.com"
  health: "https://labelhunter-web.onrender.com/api/health"   # exempt from the gate by design

tickets:
  provider: linear
  team: Troysatchell
  project: LabelHunter   # confirmed 2026-08-10: team spans 4+ projects; scope check required this

pm_skill: null   # labelhunter-factory is a ticket-dispatch orchestrator, not a gaps/scope-gate skill — passive handoff
