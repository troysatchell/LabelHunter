  toolchainFindings:                  # bugs found and fixed during the scaffold ticket
    - "pnpm run <script> -- <args> forwards a literal '--' into argv (npm strips it); Vitest's
       CLI then reads it as a positional test-name filter, so gate.sh's
       '--reporter=json --outputFile=X' was silently dropped. Fixed with
       scripts/run-tests.cjs, a wrapper that strips one leading '--'. Same fix needed for
       playwright.config.ts's webServer command — passed PORT via the env option instead."
    - "gate.sh's lint-detection glob ('ls eslint.config.* .eslintrc*') failed whenever only
       one pattern matched, so a real eslint.config.mjs-only repo always read as 'no config
       found'. Fixed on main with compgen -G (commit e1b6f13), independent of this ticket's
       branch."
