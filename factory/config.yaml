gate:
  # Cheap tier, per ticket, every attempt. Order: cheap and fail-fast first.
  checks:
    - typecheck
    - lint                            # only once a real config exists (scaffold DoD)
    - build
    - tests-vs-baseline               # failure IDENTITIES vs factory/quarantine.json
    - tests-not-weakened              # net comparison; .skip/.todo unconditional fail
    - regression-test-added           # added test CASE in a file vitest actually executes
    - changes-entry                   # anchored TRO-id match in CHANGES.md
    - eval-not-regressed              # pnpm eval:check once LH-EVAL lands; skip-with-reason before
    - scope-bounded
    - review-captured                 # advisory: pass/warn/skip only, never fail
  baselineFrom: base-ref              # NEVER the ticket branch
  quarantine: factory/quarantine.json
  # Tier 2 (expensive, batched): eval-harness accuracy deltas, latency p50/p95 vs the 5s
  # budget (TH-R2), cascade-vs-Sonnet benchmark. Conditions must match the recorded
  # environment or the delta is meaningless.

