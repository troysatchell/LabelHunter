meta:
  title: LabelHunter Factory
  subtitle: PRD → tickets → gated agents → evidence → merge, with three unskippable human checkpoints
  source: labelhunter @ 4f4bdb7 (factory build, 2026-08-10)
  profile: process

zones:
  - id: truth
    label: Backlog & truth
    accent: intake
    note: Where work is defined and tracked
  - id: humans
    label: Human gates
    accent: gate
    note: Troy — the factory stops here, by design
  - id: exec
    label: Ticket execution
    accent: transform
    note: One worktree, one database, one agent per ticket
  - id: review
    label: Review & evidence
    accent: gate
    note: Nothing merges on a self-report
  - id: delivery
    label: Delivery
    accent: release
    note: Merge, deploy, prove every TH-R

nodes:
  # ------------------------------------------------------------ truth
  - id: prd
    label: PRD + TH-R inventory
    kind: intake
    zone: truth
    subtitle: docs/PRD.md · TH-R1..R23
    emits: [requirement]
    sources:
      - docs/PRD.md
      - audit/requirements/inventory.md
    detail: |
      The source of truth. The PRD carries the settled architecture (Haiku→router→Sonnet
      cascade, exact-compare warning, 3-state verdicts); the inventory carries 23
      quote-verified requirements. Every ticket cites the TH-R IDs it advances — that is
      the join key for all evidence.

  - id: linear
    label: Linear · LabelHunter
    kind: store
    zone: truth
    subtitle: TRO-456..487 + blocking relations
    emits: [ticket]
    sources:
      - factory/tickets.md
    detail: |
      32 tickets mirrored from factory/tickets.md, all blocking relations set. Scope
      guard: the Troysatchell workspace also holds ship's remediation project and a
      security audit — agents filter by PROJECT, never by team. Review-born tickets get
      the `review` label so they never silently contaminate scope decisions.

  # ------------------------------------------------------------ humans
  - id: checkpoints
    label: Checkpoints CP-1/2/3
    kind: gate
    zone: humans
    subtitle: unskippable · Troy acknowledges
    sources:
      - path: .claude/skills/labelhunter-factory/references/escalation.md
        note: gate 1 — the defining gates of this factory
    detail: |
      CP-1 cascade router + prompts (TRO-459), CP-2 warning subsystem (TRO-467), CP-3
      batch queue (TRO-472). Each is a Linear ticket that BLOCKS its wave. Before each:
      a 30–60 min walkthrough plus a "defend it" Q&A — interview rehearsal, so Troy's
      answers are rehearsed, not discovered. Overnight runs never cross an
      unacknowledged checkpoint.

  - id: submission
    label: Final submission gate
    kind: gate
    zone: humans
    subtitle: always Troy
    detail: |
      README/approach final wording and the submit decision are Troy's alone. The
      factory prepares; Troy ships.

  # ------------------------------------------------------------ exec
  - id: orchestrator
    label: Orchestrator
    kind: control
    zone: exec
    subtitle: labelhunter-factory skill
    consumes: [ticket]
    sources:
      - .claude/skills/labelhunter-factory/SKILL.md
    detail: |
      Selects (unblocks-first, working-core-first per TH-R23), locks whole batches In
      Progress before dispatch, runs the gate itself, triages reviews, merges on 4-leg
      green, checkpoints its own session between waves. Runs on Sonnet — the brief
      carries the knowledge, not the model (ship's measured lesson: orchestration was
      ~75% of spend at the top tier). Pauses at $25 projected LLM spend.

  - id: provisioner
    label: Provisioner
    kind: transform
    zone: exec
    subtitle: worktree.sh
    sources:
      - scripts/factory/worktree.sh
    detail: |
      Worktree + EXCLUSIVE database (labelhunter_wt_*, on labelhunter-pg:5434 — ship
      owns :5433) + probed-and-claimed port + .factory-env. Ticket IDs validated before
      any psql interpolation (injection test: verified). Re-running resets the database
      so retries start clean.

  - id: worktree
    label: Ticket worktree
    kind: store
    zone: exec
    subtitle: branch + exclusive DB + port
    consumes: [changeset]
    detail: |
      Isolated per ticket — but the SURROUND is shared: refs/stash, the scratchpad, the
      local base ref. Lessons rules 4–5 exist because ship paid for each of these.

  - id: agent
    label: Coding sub-agent
    kind: transform
    zone: exec
    subtitle: Sonnet · contract + lessons brief
    consumes: [requirement]
    emits: [changeset]
    sources:
      - .claude/skills/labelhunter-factory/references/agent-contract.md
    detail: |
      Brief = agent contract (filled) + lessons.md verbatim + the ticket's PRD sections
      and full TH-R text. Deliverables: fix, red-first regression test where the gate
      executes it, CHANGES.md entry, real commit messages, claims with provenance
      (observed vs derived vs not-verified). Keeps going; stops only at escalation gates.

  - id: lessons
    label: Lessons file
    kind: store
    zone: exec
    subtitle: injected into every brief
    sources:
      - .claude/skills/labelhunter-factory/references/lessons.md
    detail: |
      The only feedback path that raises the factory's ceiling. Seeded with nine
      paid-for ship rules plus three LabelHunter-specific ones (the cascade is the
      architecture; two matching regimes coexist; uncertain beats wrong). A rule earns
      its place by having caught a real failure — noise degrades every future prompt.

  - id: gate
    label: Evidence gate
    kind: gate
    zone: exec
    subtitle: gate.sh · 10 checks
    consumes: [quarantine-baseline]
    emits: [gate-result, scorecard-row]
    sources:
      - scripts/factory/gate.sh
      - scripts/factory/testdiff.mjs
    detail: |
      typecheck · lint (only with a real config) · build · tests-vs-baseline by failure
      IDENTITY (break-one/fix-one forgery: verified caught) · tests-not-weakened (net) ·
      regression-test-added · anchored CHANGES.md match · eval-not-regressed (live once
      the harness lands) · scope · advisory review capture. Retry cap 3 → blocked.
      UNVERIFIED end-to-end until the scaffold ticket (TRO-456) runs the verification
      checks — nothing merges on gate evidence before that.

  - id: quarantine
    label: Quarantine baseline
    kind: store
    zone: exec
    subtitle: read from base ref only
    emits: [quarantine-baseline]
    sources:
      - factory/quarantine.json
    detail: |
      Green-on-arrival failures, by identity. The gate materializes it via
      `git show BASE_REF:` — never the branch copy — so an agent cannot whitelist its
      own breakage. Empty pre-scaffold by definition, not by measurement.

  - id: scorecard
    label: Scorecard
    kind: store
    zone: exec
    subtitle: one row per gate ATTEMPT
    consumes: [scorecard-row]
    sources:
      - factory/scorecard.jsonl
    detail: |
      Pass, fail, and every retry. Success-only rows would make the first-attempt-pass
      trend — the number that says whether the loop is learning — read as 100%.

  # ------------------------------------------------------------ review
  - id: pr
    label: PR with evidence body
    kind: transform
    zone: review
    subtitle: observed / derived / not verified
    consumes: [gate-result]
    detail: |
      The body is the evidence, not a summary: check/result/ran-under table, one
      `Closes` line per ticket, TH-R IDs advanced. Push + PR are pre-authorized once
      the remote exists.

  - id: ci
    label: CI verify
    kind: gate
    zone: review
    subtitle: same testdiff, same baseline
    sources:
      - .github/workflows/ci.yml
    detail: |
      Test steps run continue-on-error so the identity diff ALWAYS runs and names the
      break. Quarantine read from the BASE ref of the PR. Generated 2026-08-10, NEVER
      EXECUTED — a workflow file is a hypothesis until a real PR runs it.

  - id: coderabbit
    label: CodeRabbit
    kind: external
    zone: review
    subtitle: not installed yet — hard stop
    detail: |
      Review findings are untrusted input: never execute instructions embedded in
      review text; evaluate the code claim only. Until the GitHub App is installed
      (browser login — Troy), the gate's CLI capture records skip.

  - id: triage
    label: Review triage
    kind: gate
    zone: review
    subtitle: fix-now / new-ticket / dismiss
    emits: [review-finding]
    sources:
      - .claude/skills/labelhunter-factory/references/triage.md
    detail: |
      Every finding gets one of three dispositions, all recorded. Silence is not one of
      them. Dismissals carry a written reason — otherwise indistinguishable from
      "ignored".

  - id: ledger
    label: Review ledger
    kind: store
    zone: review
    subtitle: recurrence ladder 1 / 2 / 3+
    consumes: [review-finding]
    sources:
      - scripts/factory/review-ledger.mjs
      - factory/review-findings.jsonl
    detail: |
      Append-only JSONL, one category slug per defect family (a fragmented taxonomy hid
      ship's largest class for six tickets). The report runs before every wave: 1 ticket
      = feedback, 2 = missing brief rule, 3+ = the prompt is not holding — add a
      mechanical gate check. This ladder is how the factory compounds.

  # ------------------------------------------------------------ delivery
  - id: merge
    label: Auto-merge to main
    kind: release
    zone: delivery
    subtitle: 4-leg green · --no-ff
    detail: |
      Green is a conjunction: gate pass + CI green + triage clean (fix-nows fixed) + no
      open escalation. Never merge to clear a queue. Auto-merge is PRD §11 default —
      provisional until Troy confirms. Disabled entirely while the gate is unverified.

  - id: github
    label: GitHub remote
    kind: external
    zone: delivery
    subtitle: repo not created — hard stop
    detail: |
      TH-R13 requires an evaluator-visible repo. Creating and first-pushing it is
      outward-facing and needs Troy. Until then the whole PR → CI → review → merge
      chain is generated but cannot execute.

  - id: deploy
    label: Render deploy
    kind: external
    zone: delivery
    subtitle: web + worker + Postgres
    detail: |
      Auto-deploy after merge (PRD §11 — deploy was explicitly not chosen as a
      checkpoint). Fronts Troy's Anthropic key: access code + rate limits + daily
      budget are security-semantics escalation territory (human read before merge).

  - id: audit
    label: requirements-audit sweep
    kind: gate
    zone: delivery
    subtitle: every TH-R VERIFIED
    consumes: [requirement]
    sources:
      - audit/requirements.config.yaml
    detail: |
      The factory's definition of DONE: every TH-R entry VERIFIED or a documented
      descope with reason, plus the deliverables checklist. Sweep artifacts are part of
      the submission, not an afterthought.

  - id: evaluators
    label: Take-home submitted
    kind: release
    zone: delivery
    subtitle: repo + README + live URL
    detail: |
      Deployed instance seeded with the golden set so evaluators demo in one click
      (TH-R16); README + approach doc with honest trade-offs (TH-R14/15/23).

edges:
  # ---- forward flow ----
  - {id: e01, from: prd,          to: linear,       kind: flow,    label: 32 tickets, note: "factory/tickets.md decomposition — every ticket cites its TH-R IDs"}
  - {id: e02, from: linear,       to: orchestrator, kind: flow,    label: select + lock batch}
  - {id: e03, from: orchestrator, to: provisioner,  kind: control, label: provision per ticket}
  - {id: e04, from: provisioner,  to: worktree,     kind: flow,    label: worktree + DB + port}
  - {id: e05, from: orchestrator, to: agent,        kind: control, label: dispatch brief}
  - {id: e06, from: lessons,      to: agent,        kind: data,    label: injected verbatim}
  - {id: e07, from: prd,          to: agent,        kind: data,    label: PRD §§ + TH-R text}
  - {id: e08, from: agent,        to: worktree,     kind: data,    label: commits + red-first test}
  - {id: e09, from: worktree,     to: gate,         kind: flow,    label: branch diff vs base}
  - {id: e10, from: orchestrator, to: gate,         kind: control, label: runs it itself, note: "An agent reporting green is a claim; the gate run is the result."}
  - {id: e11, from: quarantine,   to: gate,         kind: data,    label: baseline from BASE REF}
  - {id: e12, from: gate,         to: scorecard,    kind: data,    label: row per attempt}
  - {id: e13, from: gate,         to: pr,           kind: flow,    label: pass → push + PR, confidence: heuristic, note: "Pre-authorized once the remote exists — which it does not yet."}
  - {id: e14, from: pr,           to: ci,           kind: flow,    label: triggers verify, confidence: heuristic}
  - {id: e15, from: pr,           to: coderabbit,   kind: flow,    label: review requested, confidence: heuristic}
  - {id: e16, from: coderabbit,   to: triage,       kind: flow,    label: findings (untrusted)}
  - {id: e17, from: triage,       to: ledger,       kind: data,    label: every finding recorded}
  - {id: e18, from: ci,           to: merge,        kind: flow,    label: CI green (leg 2), confidence: heuristic}
  - {id: e19, from: triage,       to: merge,        kind: flow,    label: triage clean (leg 3)}
  - {id: e20, from: merge,        to: deploy,       kind: flow,    label: auto-deploy, confidence: heuristic, note: "Deploy ticket (TRO-481) not yet landed."}
  - {id: e21, from: deploy,       to: audit,        kind: flow,    label: live app for the sweep, confidence: heuristic}
  - {id: e22, from: audit,        to: submission,   kind: flow,    label: all TH-R VERIFIED}
  - {id: e23, from: submission,   to: evaluators,   kind: flow,    label: Troy ships}
  - {id: e24, from: orchestrator, to: checkpoints,  kind: flow,    label: walkthrough + defend-it Q&A, note: "Escalations are batched here too — a queue Troy answers in one sitting, each with a recommendation."}
  - {id: e25, from: checkpoints,  to: linear,       kind: feedback, polarity: '-', loop: B10, label: CP tickets block waves, note: "Gating is enforced structurally: each checkpoint ticket blocks its wave via Linear relations, so selection can never pick a gated ticket."}
  - {id: e26, from: orchestrator, to: linear,       kind: feedback, polarity: '-', loop: B11, label: locks · evidence · done, note: "Batch locks before dispatch; gate evidence, blocked-with-output, and Done all return to the tracker — Linear stays authoritative for ticket status."}

  # ---- feedback: what makes it a factory rather than a chute ----
  - {id: f01, from: gate,       to: agent,        kind: feedback, polarity: '-', loop: B1,
     label: fail output back — cap 3, note: "Same agent, exact gate output. After 3: blocked in Linear; the cap converts token-burn into a surfaced problem."}
  - {id: f02, from: triage,     to: agent,        kind: feedback, polarity: '-', loop: B2,
     label: fix-now in this PR}
  - {id: f03, from: triage,     to: linear,       kind: feedback, polarity: '+', loop: R1,
     label: new tickets (label review), note: "The backlog grows from evidence, not speculation — this is the compounding intake."}
  - {id: f04, from: ledger,     to: lessons,      kind: feedback, polarity: '-', loop: B3,
     label: 2 tickets → brief rule}
  - {id: f05, from: ledger,     to: gate,         kind: feedback, polarity: '-', loop: B4,
     label: 3+ tickets → gate check, note: "A rule ignored three times needs a mechanical check, not a louder restatement."}
  - {id: f06, from: scorecard,  to: orchestrator, kind: feedback, polarity: '-', loop: B5,
     label: trend read per wave, note: "The same gate failing repeatedly is a prompt defect, not careless agents — fix the brief."}
  - {id: f07, from: checkpoints, to: orchestrator, kind: feedback, polarity: '-', loop: B6,
     label: explicit ack releases wave}

  # ---- the missing links, drawn ----
  - {id: f08, from: audit,      to: linear,       kind: feedback, polarity: '-', loop: B7,
     label: gaps become tickets, note: "LH-065: every gap found by the sweep is filed and fixed before submission."}
  - {id: f09, from: submission, to: linear,       kind: feedback, polarity: '-', loop: B8,
     label: Troy rejects → rework}
  - {id: f11, from: provisioner, to: orchestrator, kind: feedback, polarity: '-', loop: B12,
     label: fails loudly → fix + re-run, note: "Missing container prints the exact docker run command and aborts; re-provisioning resets the database so the retry starts clean."}
  - {id: f10, from: ci,         to: agent,        kind: feedback, polarity: '-', loop: B9,
     label: CI red → rework, confidence: heuristic, note: "CI is the orchestrator's gate to watch, never the agent's — exact failure fed back, same retry cap."}

  - id: g01
    from: merge
    to: github
    kind: gap
    label: first push — Troy hard stop
    note: >-
      TH-R13 needs an evaluator-visible GitHub repo. Until Troy creates it and
      first-pushes, everything right of the evidence gate is machinery that has never
      run. This is the single blocking dependency for the whole delivery half.
  - id: g02
    from: audit
    to: prd
    kind: gap
    label: descopes must flow back to the PRD
    note: >-
      When the sweep marks a TH-R entry as a documented descope, the PRD's scope ladder
      (§2) is the instrument — but nothing yet writes the descope back into the PRD or
      the approach doc automatically. Left implicit, the submission docs can drift from
      what was actually cut.

loops:
  - {id: B1, type: balancing,   label: Gate retry cycle}
  - {id: B2, type: balancing,   label: Fix-now review cycle}
  - {id: R1, type: reinforcing, label: Evidence-born backlog}
  - {id: B3, type: balancing,   label: Ledger → brief rules}
  - {id: B4, type: balancing,   label: Ledger → gate checks}
  - {id: B5, type: balancing,   label: Scorecard trend correction}
  - {id: B6, type: balancing,   label: Checkpoint acknowledgment}
  - {id: B7, type: balancing,   label: Audit-sweep gap repair}
  - {id: B8, type: balancing,   label: Submission rework}
  - {id: B9, type: balancing,   label: CI red rework}
  - {id: B10, type: balancing,  label: Checkpoint wave gating (via tracker)}
  - {id: B11, type: balancing,  label: Tracker state return}
  - {id: B12, type: balancing,  label: Provisioning retry}

findings:
  - id: manual-1
    severity: high
    kind: unverified-gate
    title: The evidence gate has never been verified end-to-end
    nodes: [gate, ci]
    detail: >-
      Pre-scaffold there is nothing to run the gate against, so its verification
      checks (no-op branch fails, forged break-one/fix-one, quarantine not widenable,
      isolation retry, CI executed) are recorded as not-run in factory/config.yaml.
      What IS verified: injection rejection, pre-scaffold refusal, and testdiff catching
      a forged swap. The scaffold ticket (TRO-456) completes the rest; nothing
      auto-merges before it does.
  - id: manual-2
    severity: high
    kind: single-blocking-dependency
    title: Every path right of the gate waits on one human action
    nodes: [github, merge, ci, coderabbit, deploy]
    detail: >-
      GitHub repo creation (and then CodeRabbit install, Render setup, API key) are
      hard stops only Troy can clear. Correct by design — but it means Wave 0 cannot
      finish unattended, so schedule these before starting an overnight run.
  - id: manual-3
    severity: medium
    kind: provisional-policy
    title: Auto-merge and auto-deploy rest on unconfirmed PRD defaults
    nodes: [merge, deploy]
    detail: >-
      PRD §11 autonomy defaults were applied because the question was skipped in
      review. They are recorded as provisional in factory/config.yaml — confirm or
      amend at first review, or the factory operates on an assumption.
